# This is a Declarative Automation Bundle definition for cicd.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: cicd
  uuid: 541741c7-c9f5-43c3-a9ae-de502fd70387

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-153c2307-4ec5.cloud.databricks.com
    variables:
      catalog: cicd_dev
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-153c2307-4ec5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/jithin0596@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/jithin0596@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: cicd_dev
      schema: prod
    permissions:
      - user_name: jithin0596@gmail.com
        level: CAN_MANAGE
